[project]
name = "rex-agent"
version = "0.1.0"
description = "Rex voice agent worker (LiveKit + Gnani Prisma STT / Timbre TTS)"
requires-python = ">=3.12"
dependencies = [
  "livekit-agents[gnani,openai,silero,turn-detector]~=1.8",
  "rex-shared",
  "rex-llm-router",
  "rex-mcp-gateway",
  "rex-mcp-servers",
]

[tool.uv.sources]
rex-shared = { workspace = true }
rex-llm-router = { workspace = true }
rex-mcp-gateway = { workspace = true }
rex-mcp-servers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rex_agent"]
