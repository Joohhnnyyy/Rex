[project]
name = "rex-api"
version = "0.1.0"
description = "Rex backend API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic-settings>=2.6", "httpx>=0.27", "livekit-api>=1.0", "rex-shared"]

[tool.uv.sources]
rex-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rex_api"]
