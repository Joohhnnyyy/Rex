# Eval set v1 for Rex tool routing (60+ utterances)
# Balanced across Calendar, Slack, Notion, Location, Multi-step, Small Talk, Approvals, and Hinglish.

# --- Calendar (15 cases) ---
- utterance: "Book a call with Johny tomorrow at 4 pm"
