- utterance: "What's on my calendar tomorrow?"
  expect_tool: calendar__list_events
- utterance: "When am I free on Monday afternoon for an hour?"
  expect_tool: calendar__find_free_slots
- utterance: "Schedule a sync with the frontend team on Friday at 11 am"
  expect_tool: calendar__create_event
- utterance: "List all my meetings for today"
  expect_tool: calendar__list_events
- utterance: "Find 45 minutes of free time this Wednesday"
  expect_tool: calendar__find_free_slots
- utterance: "Delete the demo sync event"
  expect_tool: calendar__delete_event
- utterance: "Cancel my 3 pm appointment"
  expect_tool: calendar__delete_event
- utterance: "Move my 2 pm meeting to 3 pm tomorrow"
  expect_tool: calendar__update_event
- utterance: "Reschedule the product review to Monday 10 am"
  expect_tool: calendar__update_event
- utterance: "Do I have any conflicts between 2 pm and 4 pm today?"
  expect_tool: calendar__list_events
- utterance: "Add Shanky to the 4 pm demo meeting"
  expect_tool: calendar__update_event
- utterance: "Set up a 15-minute quick chat tomorrow morning at 9:30"
  expect_tool: calendar__create_event
- utterance: "Show my schedule for next week"
  expect_tool: calendar__list_events
- utterance: "Check my free slots for tomorrow between 2 pm and 6 pm"
  expect_tool: calendar__find_free_slots

