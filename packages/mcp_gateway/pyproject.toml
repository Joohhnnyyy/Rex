[project]
name = "rex-mcp-gateway"
version = "0.1.0"
description = "MCP client hub for Rex: permission tiers, approvals, audit events"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3", "pyyaml>=6.0", "rex-shared"]

[tool.uv.sources]
rex-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rex_mcp_gateway"]
