[project]
name = "rex-llm-router"
version = "0.1.0"
description = "Model routing with free-tier fallback (Gemini, Mistral, Codestral, OpenRouter)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rex_llm_router"]
