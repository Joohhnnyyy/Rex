[project]
name = "rex-shared"
version = "0.1.0"
description = "Shared data contracts for Rex (source of truth for TS types)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rex_shared"]
